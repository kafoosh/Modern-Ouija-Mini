<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Protected</title>
<style>html,body{margin:0;height:100%;background:#000;}</style>
<script>
/* board.oddpaq.com/<word> lands here (GitHub Pages serves 404.html for unknown paths).
   Hand the word to the board and reload the bare domain, replacing this history entry. */
(function(){
  var w=location.pathname.replace(/^\/+|\/+$/g,''), stored=false;
  try{ w=decodeURIComponent(w); }catch(e){}
  try{ sessionStorage.setItem('ouija-word',w); stored=true; }catch(e){}
  location.replace('/'+(stored||!w ? '' : '#w='+encodeURIComponent(w)));
})();
</script>
</head>
<body></body>
</html>
